# Prometheus 수집 설정: 15초마다 앱·OCR 서비스의 /metrics 를 읽어 간다 (pull 방식)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 알람 규칙 (조건을 15초마다 평가) → firing 이면 Alertmanager 로 보낸다
rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: app            # FastAPI 앱 (Hi-SAM, 지리좌표, GPX)
    static_configs:
      - targets: ["app:8010"]

  - job_name: ocr            # OCR 서비스 (PaddleOCR)
    static_configs:
      - targets: ["ocr:8020"]
